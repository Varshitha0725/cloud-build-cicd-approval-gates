
name: CI-CD Pipeline with Approval Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

  deploy:
    name: Approval and Demo Deployment
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'

    environment:
      name: production

    steps:
      - name: Simulate deployment
        run: |
          echo "Approval received."
          echo "Build and tests passed."
          echo "Simulated deployment completed successfully."
          echo "This is a demonstration, not a real Cloud Run deployment."
